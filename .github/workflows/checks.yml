# All checks of the repo, on macOS and Linux: FigPal is for both. The browser checks run on macOS only: on Ubuntu, the
# check "anim" got empty frames from the WebM (2026-11-12, not solved yet).
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm package
      - run: pnpm e2e
        if: matrix.os == 'macos-latest'
