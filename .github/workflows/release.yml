# Publishes the npm package "figpal" (local/) for a tag such as v0.1.1, with provenance. The tag must be the version in
# local/package.json. npm trusted publishing (OIDC): on npmjs.com, the package has this repository and release.yml as
# its trusted publisher, so no token is necessary. npm refused a token (403: tokens that bypass 2FA cannot publish).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The tag is the version of the package
        run: test "v$(node -p "require('./local/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm package
      # The command bundles its dependencies: users need none. The devDependencies have workspace versions
      # ("workspace:*"), which pnpm cannot publish for the private package @figpal/shared.
      - run: npm pkg delete devDependencies
        working-directory: local
      - run: npm publish --provenance --access public
        working-directory: local
